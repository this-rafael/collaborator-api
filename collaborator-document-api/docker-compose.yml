services:
  mongodb:
    image: mongo:7.0.37
    container_name: collaborator-document-mongodb
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval "try { quit(rs.status().ok === 1 ? 0 : 1) } catch (e) { quit(1) }"'
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  mongodb-init:
    image: mongo:7.0.37
    container_name: collaborator-document-mongodb-init
    depends_on:
      - mongodb
    network_mode: service:mongodb
    entrypoint:
      - bash
      - -c
      - |
        set -e
        for i in $$(seq 1 60); do
          if mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1; then
            break
          fi
          sleep 1
        done
        mongosh --quiet --eval '
          try {
            const status = rs.status();
            if (status.ok === 1) {
              print("Replica set already initialized");
              quit(0);
            }
          } catch (error) {
            print("Initializing replica set rs0...");
          }
          rs.initiate({
            _id: "rs0",
            members: [{_id: 0, host: "localhost:27017"}]
          });
          const deadline = Date.now() + 30000;
          while (Date.now() < deadline) {
            try {
              const current = rs.status();
              if (current.ok === 1 && current.members?.[0]?.stateStr === "PRIMARY") {
                print("Replica set rs0 is PRIMARY");
                quit(0);
              }
            } catch (error) {}
            sleep(1000);
          }
          print("Replica set did not become PRIMARY in time");
          quit(1);
        '
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collaborator-document-api
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/collaborator_documents?replicaSet=rs0&directConnection=true
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    profiles:
      - full

  sonarqube:
    image: docker.io/library/sonarqube:community
    container_name: collaborator-document-sonarqube
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sf http://localhost:9000/api/system/status | grep -q ''"status":"UP"'''
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    profiles:
      - quality

  sonar-scanner:
    image: docker.io/sonarsource/sonar-scanner-cli
    container_name: collaborator-document-sonar-scanner
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      - .:/usr/src:Z
    working_dir: /usr/src
    profiles:
      - quality
    restart: "no"

volumes:
  mongodb_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
