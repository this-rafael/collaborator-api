services:
  mongodb:
    image: mongo:7.0.37
    container_name: collaborator-document-mongodb
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval "try { quit(rs.status().ok === 1 ? 0 : 1) } catch (e) { quit(1) }"'
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  mongodb-init:
    image: mongo:7.0.37
    container_name: collaborator-document-mongodb-init
    depends_on:
      - mongodb
    network_mode: service:mongodb
    entrypoint:
      - bash
      - -c
      - |
        set -e
        for i in $$(seq 1 60); do
          if mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1; then
            break
          fi
          sleep 1
        done
        mongosh --quiet --eval '
          try {
            const status = rs.status();
            if (status.ok === 1) {
              print("Replica set already initialized");
              quit(0);
            }
          } catch (error) {
            print("Initializing replica set rs0...");
          }
          rs.initiate({
            _id: "rs0",
            members: [{_id: 0, host: "localhost:27017"}]
          });
          const deadline = Date.now() + 30000;
          while (Date.now() < deadline) {
            try {
              const current = rs.status();
              if (current.ok === 1 && current.members?.[0]?.stateStr === "PRIMARY") {
                print("Replica set rs0 is PRIMARY");
                quit(0);
              }
            } catch (error) {}
            sleep(1000);
          }
          print("Replica set did not become PRIMARY in time");
          quit(1);
        '
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collaborator-document-api
    # Prefer healthy Mongo (replica set already initialized by mongodb-init).
    # podman-compose drops one-shot containers, so service_completed_successfully
    # on mongodb-init breaks API startup.
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/collaborator_documents?replicaSet=rs0&directConnection=true
      CURSOR_HMAC_SECRET: ${CURSOR_HMAC_SECRET:-change-this-development-secret-to-at-least-32-bytes}
      LOG_LEVEL: info
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: collaborator-document-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "3010:3000"
    profiles:
      - full

  tempo:
    image: docker.io/grafana/tempo:2.6.1
    container_name: collaborator-document-tempo
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yml:ro,Z
    ports:
      - "3210:3200"
    profiles:
      - observability

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.120.0
    container_name: collaborator-document-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro,Z
    ports:
      - "14317:4317"
      - "14318:4318"
      - "18889:8889"
    depends_on:
      - tempo
    profiles:
      - observability

  prometheus:
    image: docker.io/prom/prometheus:v3.2.1
    container_name: collaborator-document-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
    ports:
      - "9091:9090"
    depends_on:
      - otel-collector
    profiles:
      - observability

  grafana:
    image: docker.io/grafana/grafana:11.4.0
    container_name: collaborator-document-grafana
    ports:
      - "3011:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
    depends_on:
      - prometheus
      - tempo
    profiles:
      - observability

  sonarqube:
    image: docker.io/library/sonarqube:community
    container_name: collaborator-document-sonarqube
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sf http://localhost:9000/api/system/status | grep -q ''"status":"UP"'''
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    profiles:
      - quality

  sonar-scanner:
    image: docker.io/sonarsource/sonar-scanner-cli
    container_name: collaborator-document-sonar-scanner
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      - .:/usr/src:Z
    working_dir: /usr/src
    profiles:
      - quality
    restart: "no"

volumes:
  mongodb_data:
  grafana_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
