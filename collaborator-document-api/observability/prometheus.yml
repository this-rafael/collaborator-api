global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets:
          - otel-collector:8889
        labels:
          service: collaborator-document-api
    metric_relabel_configs:
      - source_labels: [service_name]
        regex: (.+)
        target_label: job
      - source_labels: [exported_job]
        regex: (.+)
        target_label: job

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
