  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor stateless, opaco, base64url e assinado com HMAC-SHA-256, retornado no link next da página anterior.
        Expira em 15 minutos e é vinculado à operação, aos filtros normalizados, à ordenação e ao limit. Não deve ser interpretado
        pelo cliente. Cursor vazio, adulterado, expirado ou incompatível retorna 400 INVALID_QUERY_PARAMETER com errors.field=cursor.
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Quantidade máxima de itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag fraco previamente retornado para validação semântica do cache de leitura.
      schema:
        type: string
  headers:
    ETag:
      description: ETag fraco no formato W/"sha256:<hash>". O hash usa JSON canônico dos dados semanticamente relevantes,
        incluindo filtros, ordenação, cursor, limit e estado que determina links HAL. Exclui calculatedAt, identificadores
        de trace, headers e campos gerados somente no instante da resposta.
      schema:
        type: string
        pattern: ^W/"sha256:[a-f0-9]{64}"$
      example: 'W/"sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"'
    Location:
      description: URI do recurso criado.
      schema:
        type: string
    RetryAfter:
      description: Tempo, em segundos, até uma nova tentativa.
      schema:
        type: integer
        minimum: 1
  responses:
    NotModified:
      description: A representação semântica não foi alterada desde o ETag informado. A resposta não possui corpo.
