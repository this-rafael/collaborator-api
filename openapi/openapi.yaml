components:
  schemas:
    ObjectId:
      type: string
      pattern: ^[a-fA-F0-9]{24}$
      description: Identificador MongoDB ObjectId exposto em formato hexadecimal.
      examples:
      - 66a64ab05bd7213b90d9b001
    DateTime:
      type: string
      format: date-time
      description: Data e hora em ISO 8601 e UTC.
      examples:
      - '2026-07-27T14:30:00.000Z'
    NullableDateTime:
      oneOf:
      - $ref: '#/components/schemas/DateTime'
      - type: 'null'
    HealthStatus:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          const: ok
      additionalProperties: false
    HalLink:
      type: object
      required:
      - href
      properties:
        href:
          type: string
          description: URI ou URI Template do recurso relacionado.
        templated:
          type: boolean
          default: false
        method:
          type: string
          enum:
          - GET
          - POST
          - PATCH
          - DELETE
          description: Método sugerido para links de ação.
        type:
          type: string
          description: Media type esperado para o recurso relacionado.
        title:
          type: string
      additionalProperties: false
    HalLinks:
      type: object
      description: Relações HATEOAS. Links de ação aparecem somente quando a transição é válida para o estado atual.
      additionalProperties:
        $ref: '#/components/schemas/HalLink'
    ApiRoot:
      type: object
      required:
      - name
      - version
      - _links
      properties:
        name:
          type: string
        version:
          type: string
        _links:
          $ref: '#/components/schemas/HalLinks'
      additionalProperties: false
      example:
        name: Collaborator Document API
        version: '1'
        _links:
          self:
            href: /api/v1
          collaborators:
            href: /api/v1/collaborators{?cursor,limit,name,cpf,email}
            templated: true
          document-types:
            href: /api/v1/document-types{?cursor,limit,name,code}
            templated: true
          collaborator-documents:
            href: /api/v1/collaborator-documents{?cursor,limit,collaboratorId,documentTypeId,status,lifecycle}
            templated: true
          pending-documents:
            href: /api/v1/pending-documents{?cursor,limit,collaboratorName,cpf,documentTypeName,documentTypeCode}
            templated: true
          completeness:
            href: /api/v1/statistics/completeness
          pending-document-types:
            href: /api/v1/statistics/pending-document-types{?cursor,limit}
            templated: true
          latest-submissions:
            href: /api/v1/submissions/latest{?cursor,limit}
            templated: true
          submission-events:
            href: /api/v1/submission-events{?cursor,limit}
            templated: true
    CollaboratorCreateRequest:
      type: object
      required:
      - name
      - cpf
      - email
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          examples:
          - Ana Souza
        cpf:
          type: string
          pattern: ^\d{11}$
          description: CPF normalizado somente com dígitos.
          examples:
          - '12345678909'
        email:
          type: string
          format: email
          maxLength: 320
          examples:
          - ana.souza@example.com
      additionalProperties: false
    CollaboratorPatchRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        cpf:
          type: string
          pattern: ^\d{11}$
        email:
          type: string
          format: email
          maxLength: 320
      additionalProperties: false
    Collaborator:
      type: object
      required:
      - id
      - name
      - cpf
      - email
      - createdAt
      - updatedAt
      - deletedAt
      - _links
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        cpf:
          type: string
          pattern: ^\d{11}$
        email:
          type: string
          format: email
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        deletedAt:
          $ref: '#/components/schemas/NullableDateTime'
        _links:
          $ref: '#/components/schemas/HalLinks'
      additionalProperties: false
      description: Quando deletedAt é diferente de null, links de alteração, exclusão e criação de vínculo não são retornados.
      example:
        id: 66a64ab05bd7213b90d9b001
        name: Ana Souza
        cpf: '12345678909'
        email: ana.souza@example.com
        createdAt: '2026-07-27T12:00:00.000Z'
        updatedAt: '2026-07-27T12:00:00.000Z'
        deletedAt: null
        _links:
          self:
            href: /api/v1/collaborators/66a64ab05bd7213b90d9b001
          collection:
            href: /api/v1/collaborators
          update:
            href: /api/v1/collaborators/66a64ab05bd7213b90d9b001
            method: PATCH
          delete:
            href: /api/v1/collaborators/66a64ab05bd7213b90d9b001
            method: DELETE
          documents:
            href: /api/v1/collaborator-documents?collaboratorId=66a64ab05bd7213b90d9b001
          link-document:
            href: /api/v1/collaborator-documents
            method: POST
    DocumentTypeCreateRequest:
      type: object
      required:
      - name
      - code
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
          description: Código estável normalizado em maiúsculas.
        description:
          oneOf:
          - type: string
            maxLength: 1000
          - type: 'null'
      additionalProperties: false
      example:
        name: Atestado de Saúde Ocupacional
        code: ASO
        description: Documento de aptidão ocupacional
    DocumentTypePatchRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
          description: Embora alterável, deve ser tratado como identificador estável.
        description:
          oneOf:
          - type: string
            maxLength: 1000
          - type: 'null'
      additionalProperties: false
    DocumentType:
      type: object
      required:
      - id
      - name
      - code
      - description
      - createdAt
      - updatedAt
      - deletedAt
      - _links
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
        description:
          oneOf:
          - type: string
          - type: 'null'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        deletedAt:
          $ref: '#/components/schemas/NullableDateTime'
        _links:
          $ref: '#/components/schemas/HalLinks'
      additionalProperties: false
      example:
        id: 66a64ab05bd7213b90d9b010
        name: Atestado de Saúde Ocupacional
        code: ASO
        description: Documento de aptidão ocupacional
        createdAt: '2026-07-27T12:00:00.000Z'
        updatedAt: '2026-07-27T12:00:00.000Z'
        deletedAt: null
        _links:
          self:
            href: /api/v1/document-types/66a64ab05bd7213b90d9b010
          collection:
            href: /api/v1/document-types
          update:
            href: /api/v1/document-types/66a64ab05bd7213b90d9b010
            method: PATCH
          delete:
            href: /api/v1/document-types/66a64ab05bd7213b90d9b010
            method: DELETE
          documents:
            href: /api/v1/collaborator-documents?documentTypeId=66a64ab05bd7213b90d9b010
          pending-documents:
            href: /api/v1/pending-documents?documentTypeCode=ASO
    DocumentStatus:
      type: string
      enum:
      - PENDING
      - SUBMITTED
    DocumentLifecycle:
      type: string
      enum:
      - active
      - unlinked
      - deleted
      - all
      default: active
    DocumentMetadata:
      type: object
      required:
      - originalName
      - mimeType
      - sizeBytes
      - storageKey
      - notes
      properties:
        originalName:
          type: string
          minLength: 1
          maxLength: 512
        mimeType:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
        sizeBytes:
          oneOf:
          - type: integer
            format: int64
            minimum: 0
          - type: 'null'
        storageKey:
          oneOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        notes:
          oneOf:
          - type: string
            maxLength: 4000
          - type: 'null'
      additionalProperties: false
    VersionCreateMetadata:
      type: object
      required:
      - originalName
      properties:
        originalName:
          type: string
          minLength: 1
          maxLength: 512
        mimeType:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
          default: null
        sizeBytes:
          oneOf:
          - type: integer
            format: int64
            minimum: 0
          - type: 'null'
          default: null
        storageKey:
          oneOf:
          - type: string
            maxLength: 1024
          - type: 'null'
          default: null
        notes:
          oneOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          default: null
      additionalProperties: false
    VersionCreateRequest:
      type: object
      required:
      - metadata
      properties:
        metadata:
          $ref: '#/components/schemas/VersionCreateMetadata'
      additionalProperties: false
      example:
        metadata:
          originalName: aso-ana-souza.pdf
          mimeType: application/pdf
          sizeBytes: 248193
          storageKey: collaborators/66a64ab05bd7213b90d9b001/aso/v2.pdf
          notes: Documento renovado
    DocumentVersion:
      type: object
      required:
      - version
      - submittedAt
      - metadata
      - _links
      properties:
        version:
          type: integer
          minimum: 1
        submittedAt:
          $ref: '#/components/schemas/DateTime'
        metadata:
          $ref: '#/components/schemas/DocumentMetadata'
        _links:
          $ref: '#/components/schemas/HalLinks'
      additionalProperties: false
      example:
        version: 2
        submittedAt: '2026-07-27T14:30:00.000Z'
        metadata:
          originalName: aso-ana-souza.pdf
          mimeType: application/pdf
          sizeBytes: 248193
          storageKey: collaborators/66a64ab05bd7213b90d9b001/aso/v2.pdf
          notes: Documento renovado
        _links:
          self:
            href: /api/v1/collaborator-documents/66a64ab05bd7213b90d9b100/versions/2
          document:
            href: /api/v1/collaborator-documents/66a64ab05bd7213b90d9b100
          previous:
            href: /api/v1/collaborator-documents/66a64ab05bd7213b90d9b100/versions/1
    CollaboratorDocumentCreateRequest:
      type: object
      required:
      - collaboratorId
      - documentTypeId
      properties:
        collaboratorId:
          $ref: '#/components/schemas/ObjectId'
        documentTypeId:
          $ref: '#/components/schemas/ObjectId'
      additionalProperties: false
      example:
        collaboratorId: 66a64ab05bd7213b90d9b001
        documentTypeId: 66a64ab05bd7213b90d9b010
    CollaboratorDocument:
      type: object
      required:
      - id
      - collaboratorId
      - documentTypeId
      - status
      - currentVersion
      - lastSubmittedAt
      - linkedAt
      - unlinkedAt
      - createdAt
      - updatedAt
      - deletedAt
      - _links
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        collaboratorId:
          $ref: '#/components/schemas/ObjectId'
        documentTypeId:
          $ref: '#/components/schemas/ObjectId'
        status:
          $ref: '#/components/schemas/DocumentStatus'
        currentVersion:
          type: integer
          minimum: 0
        lastSubmittedAt:
          $ref: '#/components/schemas/NullableDateTime'
        linkedAt:
          $ref: '#/components/schemas/DateTime'
        unlinkedAt:
          $ref: '#/components/schemas/NullableDateTime'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        deletedAt:
          $ref: '#/components/schemas/NullableDateTime'
        _links:
          $ref: '#/components/schemas/HalLinks'
      allOf:
      - if:
          properties:
            status:
              const: PENDING
        then:
          properties:
            currentVersion:
              const: 0
            lastSubmittedAt:
              type: 'null'
      - if:
          properties:
            status:
              const: SUBMITTED
        then:
          properties:
            currentVersion:
              type: integer
              minimum: 1
            lastSubmittedAt:
              $ref: '#/components/schemas/DateTime'
      additionalProperties: false
      description: Vínculos ativos PENDING oferecem submit-version e unlink; SUBMITTED oferecem current-version, resubmit-version
        e unlink. Vínculos desvinculados ou removidos oferecem apenas consulta histórica.
      examples:
      - id: 66a64ab05bd7213b90d9b100
        collaboratorId: 66a64ab05bd7213b90d9b001
        documentTypeId: 66a64ab05bd7213b90d9b010
        status: PENDING
        currentVersion: 0
        lastSubmittedAt: null
        linkedAt: '2026-07-27T13:00:00.000Z'
        unlinkedAt: null
        createdAt: '2026-07-27T13:00:00.000Z'
        updatedAt: '2026-07-27T13:00:00.000Z'
        deletedAt: null
        _links:
          self:
            href: /api/v1/collaborator-documents/66a64ab05bd7213b90d9b100
          collaborator:
            href: /api/v1/collaborators/66a64ab05bd7213b90d9b001
          document-type:
            href: /api/v1/document-types/66a64ab05bd7213b90d9b010
          versions:
            href: /api/v1/collaborator-documents/66a64ab05bd7213b90d9b100/versions
          submit-version:
            href: /api/v1/collaborator-documents/66a64ab05bd7213b90d9b100/versions
            method: POST
          unlink:
            href: /api/v1/collaborator-documents/66a64ab05bd7213b90d9b100
            method: DELETE
      - id: 66a64ab05bd7213b90d9b100
        collaboratorId: 66a64ab05bd7213b90d9b001
        documentTypeId: 66a64ab05bd7213b90d9b010
        status: SUBMITTED
