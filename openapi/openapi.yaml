openapi: 3.1.0
info:
  title: Collaborator Document API
  version: 1.0.0
  summary: API REST com HATEOAS para gestão documental de colaboradores.
  description: 'API orientada a recursos para colaboradores, tipos de documento, vínculos documentais, versões e estatísticas.


    Representações de sucesso usam HAL (`application/hal+json`) e erros usam Problem Details (`application/problem+json`).
    A presença de um link em `_links` comunica que uma navegação ou transição está disponível no estado atual. A ausência
    do link comunica que a ação não deve ser oferecida pelo cliente.


    O escopo atual não possui autenticação. O MongoDB deve operar em replica set porque o soft delete de colaboradores e tipos
    propaga para vínculos por transação. O envio de versões é atômico no próprio documento e aceita reenvios concorrentes,
    criando versões sequenciais distintas.


    O contrato contém 23 operações funcionais sob `/api/v1` e dois endpoints operacionais de saúde fora dessa base. Todos
    os GETs funcionais usam ETag fraco semântico; os endpoints de saúde não usam HAL, ETag ou rate limit.'
  contact:
    name: Rafael Pereira
    url: https://github.com/this-rafael/collaborator-api
  license:
    name: Proprietary
servers:
- url: https://api.example.com
  description: Servidor de exemplo
- url: http://localhost:3000
  description: Desenvolvimento local
tags:
- name: Discovery
  description: Descoberta dos recursos e relações da API.
- name: Collaborators
  description: Cadastro e ciclo de vida de colaboradores.
- name: Document Types
  description: Catálogo de tipos de documento.
- name: Collaborator Documents
  description: Vínculos documentais e ciclos de vinculação.
- name: Document Versions
  description: Histórico e envio atômico de versões.
- name: Queries
  description: Consultas projetadas para pendências.
- name: Statistics
  description: Indicadores agregados de completude e pendências.
- name: Submissions
  description: Últimos envios e eventos históricos.
- name: Health
  description: Liveness e readiness operacionais, fora da API de negócio.
security: []
paths:
  /health/live:
    get:
      tags:
      - Health
      summary: Verificar liveness do processo
      operationId: getLiveness
      description: Verifica somente se o processo está operacional. Não consulta MongoDB e não aplica HAL, ETag ou rate limit.
      responses:
        '200':
          description: Processo operacional.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
  /health/ready:
    get:
      tags:
      - Health
      summary: Verificar readiness da aplicação
      operationId: getReadiness
      description: Verifica a conexão MongoDB e se o ambiente está apto a executar as operações exigidas. Não aplica HAL,
        ETag ou rate limit.
      responses:
        '200':
          description: Aplicação apta a receber tráfego.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
        '503':
          description: A aplicação não está apta porque uma dependência necessária está temporariamente indisponível.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.example.com/problems/service-unavailable
                title: Serviço temporariamente indisponível
                status: 503
                detail: A aplicação ainda não está apta a receber tráfego.
                instance: /health/ready
                code: SERVICE_UNAVAILABLE
                traceId: 01J3Y2QHB8FV4RGY7Y1QXNT2D4
  /api/v1:
    get:
      tags:
      - Discovery
      summary: Descobrir os recursos da API
      operationId: discoverApi
      description: Retorna os pontos de entrada disponíveis para os consumidores da API.
      parameters:
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Pontos de entrada e relações disponíveis.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ApiRoot'
              example:
                name: Collaborator Document API
                version: '1'
                _links:
                  self:
                    href: /api/v1
                  collaborators:
                    href: /api/v1/collaborators{?cursor,limit,name,cpf,email}
                    templated: true
                  document-types:
                    href: /api/v1/document-types{?cursor,limit,name,code}
                    templated: true
                  collaborator-documents:
                    href: /api/v1/collaborator-documents{?cursor,limit,collaboratorId,documentTypeId,status,lifecycle}
                    templated: true
                  pending-documents:
                    href: /api/v1/pending-documents{?cursor,limit,collaboratorName,cpf,documentTypeName,documentTypeCode}
                    templated: true
                  completeness:
                    href: /api/v1/statistics/completeness
                  pending-document-types:
                    href: /api/v1/statistics/pending-document-types{?cursor,limit}
                    templated: true
                  latest-submissions:
                    href: /api/v1/submissions/latest{?cursor,limit}
                    templated: true
                  submission-events:
                    href: /api/v1/submission-events{?cursor,limit}
                    templated: true
        '304':
          $ref: '#/components/responses/NotModified'
        '429':
          description: O limite de requisições desta operação foi excedido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                rateLimitExceeded:
                  summary: Rate limit da operação excedido
                  value:
                    type: https://api.example.com/problems/rate-limit-exceeded
                    title: Limite de requisições excedido
                    status: 429
                    detail: O limite de requisições para descobrir os recursos da API foi excedido. Aguarde antes de tentar
                      novamente.
                    instance: /api/v1
                    code: RATE_LIMIT_EXCEEDED
                    traceId: 01J3Y2QHB8FV4RGY7Y1QXNT2D4
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '500':
          description: Ocorreu uma falha interna durante esta operação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                internalServerError:
                  summary: Erro interno específico da operação
                  value:
                    type: https://api.example.com/problems/internal-server-error
                    title: Falha interna ao processar a operação
                    status: 500
                    detail: Ocorreu uma falha inesperada ao descobrir os recursos da API.
                    instance: /api/v1
                    code: INTERNAL_SERVER_ERROR
                    traceId: 01J3Y2QHB8FV4RGY7Y1QXNT2D4
        '503':
          description: Uma dependência necessária para esta operação está temporariamente indisponível.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                serviceUnavailable:
                  summary: Dependência necessária indisponível
                  value:
                    type: https://api.example.com/problems/service-unavailable
                    title: Serviço temporariamente indisponível
                    status: 503
                    detail: Não foi possível descobrir os recursos da API porque o MongoDB ou outra dependência necessária
                      está indisponível.
                    instance: /api/v1
                    code: SERVICE_UNAVAILABLE
                    traceId: 01J3Y2QHB8FV4RGY7Y1QXNT2D4
  /api/v1/collaborators:
    post:
      tags:
      - Collaborators
      summary: Criar colaborador
      operationId: createCollaborator
      description: Cria um colaborador ativo com CPF e e-mail únicos entre registros ativos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollaboratorCreateRequest'
            example:
              name: Ana Souza
              cpf: '12345678909'
              email: ana.souza@example.com
      responses:
        '201':
          description: Colaborador criado.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Collaborator'
              example:
                id: 66a64ab05bd7213b90d9b001
                name: Ana Souza
                cpf: '12345678909'
                email: ana.souza@example.com
                createdAt: '2026-07-27T12:00:00.000Z'
                updatedAt: '2026-07-27T12:00:00.000Z'
                deletedAt: null
                _links:
                  self:
                    href: /api/v1/collaborators/66a64ab05bd7213b90d9b001
                  collection:
                    href: /api/v1/collaborators
                  update:
                    href: /api/v1/collaborators/66a64ab05bd7213b90d9b001
                    method: PATCH
                  delete:
                    href: /api/v1/collaborators/66a64ab05bd7213b90d9b001
                    method: DELETE
                  documents:
                    href: /api/v1/collaborator-documents?collaboratorId=66a64ab05bd7213b90d9b001
                  link-document:
                    href: /api/v1/collaborator-documents
                    method: POST
          links:
            GetCollaborator:
              operationId: getCollaborator
              parameters:
                id: $response.body#/id
            UpdateCollaborator:
              operationId: updateCollaborator
              parameters:
                id: $response.body#/id
            DeleteCollaborator:
              operationId: deleteCollaborator
              parameters:
                id: $response.body#/id
        '400':
          description: A requisição desta operação possui sintaxe, identificador ou parâmetro inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                malformedJson:
                  summary: JSON inválido
                  value:
                    type: https://api.example.com/problems/malformed-json
                    title: Corpo JSON malformado
                    status: 400
                    detail: Não foi possível interpretar o corpo JSON enviado para criar o colaborador.
                    instance: /api/v1/collaborators
                    code: MALFORMED_JSON
                    traceId: 01J3Y2QHB8FV4RGY7Y1QXNT2D4
        '409':
          description: A operação conflita com uma restrição de unicidade ou com o estado atual do recurso.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                duplicateCpf:
                  summary: CPF duplicado entre colaboradores ativos
                  value:
                    type: https://api.example.com/problems/duplicate-active-cpf
                    title: CPF já cadastrado
                    status: 409
                    detail: Já existe um colaborador ativo cadastrado com o CPF 12345678909.
                    instance: /api/v1/collaborators
                    code: DUPLICATE_ACTIVE_CPF
                    traceId: 01J3Y2QHB8FV4RGY7Y1QXNT2D4
                    errors:
                    - field: cpf
                      code: DUPLICATE_ACTIVE_CPF
                      message: O CPF já pertence a outro colaborador ativo.
                duplicateEmail:
                  summary: E-mail duplicado entre colaboradores ativos
                  value:
                    type: https://api.example.com/problems/duplicate-active-email
                    title: E-mail já cadastrado
                    status: 409
                    detail: Já existe um colaborador ativo cadastrado com o e-mail ana.souza@example.com.
                    instance: /api/v1/collaborators
                    code: DUPLICATE_ACTIVE_EMAIL
                    traceId: 01J3Y2QHB8FV4RGY7Y1QXNT2D4
                    errors:
                    - field: email
                      code: DUPLICATE_ACTIVE_EMAIL
                      message: O e-mail já pertence a outro colaborador ativo.
        '415':
          description: O Content-Type enviado não é suportado por esta operação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                unsupportedMediaType:
                  summary: Content-Type incompatível com a operação
                  value:
                    type: https://api.example.com/problems/unsupported-media-type
                    title: Tipo de mídia não suportado
                    status: 415
                    detail: O corpo usado para criar o colaborador deve ser enviado com Content-Type application/json.
                    instance: /api/v1/collaborators
                    code: UNSUPPORTED_MEDIA_TYPE
                    traceId: 01J3Y2QHB8FV4RGY7Y1QXNT2D4
        '422':
          description: O corpo foi interpretado, mas contém dados inválidos para o recurso.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                validationError:
                  summary: Falha de validação do recurso
                  value:
                    type: https://api.example.com/problems/validation-error
                    title: Dados inválidos
                    status: 422
                    detail: Os dados informados para o colaborador violam as regras de validação.
                    instance: /api/v1/collaborators
                    code: VALIDATION_ERROR
                    traceId: 01J3Y2QHB8FV4RGY7Y1QXNT2D4
                    errors:
                    - field: name
                      code: REQUIRED
                      message: O nome do colaborador é obrigatório.
                    - field: cpf
                      code: INVALID_CPF
                      message: O CPF do colaborador deve conter 11 dígitos válidos.
                    - field: email
                      code: INVALID_EMAIL
                      message: O e-mail do colaborador deve possuir formato válido.
        '429':
          description: O limite de requisições desta operação foi excedido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                rateLimitExceeded:
                  summary: Rate limit da operação excedido
                  value:
                    type: https://api.example.com/problems/rate-limit-exceeded
                    title: Limite de requisições excedido
                    status: 429
                    detail: O limite de requisições para criar o colaborador foi excedido. Aguarde antes de tentar novamente.
                    instance: /api/v1/collaborators
                    code: RATE_LIMIT_EXCEEDED
                    traceId: 01J3Y2QHB8FV4RGY7Y1QXNT2D4
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '500':
          description: Ocorreu uma falha interna durante esta operação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                internalServerError:
                  summary: Erro interno específico da operação
                  value:
                    type: https://api.example.com/problems/internal-server-error
                    title: Falha interna ao processar a operação
                    status: 500
                    detail: Ocorreu uma falha inesperada ao criar o colaborador.
                    instance: /api/v1/collaborators
                    code: INTERNAL_SERVER_ERROR
                    traceId: 01J3Y2QHB8FV4RGY7Y1QXNT2D4
        '503':
          description: Uma dependência necessária para esta operação está temporariamente indisponível.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                serviceUnavailable:
                  summary: Dependência necessária indisponível
                  value:
                    type: https://api.example.com/problems/service-unavailable
                    title: Serviço temporariamente indisponível
                    status: 503
                    detail: Não foi possível criar o colaborador porque o MongoDB ou outra dependência necessária está indisponível.
                    instance: /api/v1/collaborators
                    code: SERVICE_UNAVAILABLE
                    traceId: 01J3Y2QHB8FV4RGY7Y1QXNT2D4
    get:
      tags:
      - Collaborators
      summary: Listar colaboradores ativos
      operationId: listCollaborators
      description: Todos os filtros informados são combinados por AND. Ordenação total por _id ASC.
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/IfNoneMatch'
      - name: name
        in: query
        schema:
          type: string
        description: Busca por substring após trim e colapso de espaços, sem diferenciar caixa ou acentos.
      - name: cpf
        in: query
        schema:
          type: string
          pattern: ^\d{11}$
        description: Busca exata pelo CPF normalizado com 11 dígitos.
      - name: email
        in: query
        schema:
          type: string
          format: email
        description: Busca exata sem diferenciar maiúsculas de minúsculas.
      responses:
        '200':
          description: Página de colaboradores ativos.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/CollaboratorCollection'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          description: A requisição desta operação possui sintaxe, identificador ou parâmetro inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalidQueryParameter:
                  summary: Filtro ou cursor inválido
                  value:
                    type: https://api.example.com/problems/invalid-query-parameter
                    title: Parâmetro de consulta inválido
                    status: 400
                    detail: Um ou mais parâmetros usados para listar colaboradores são inválidos.
                    instance: /api/v1/collaborators
                    code: INVALID_QUERY_PARAMETER
                    traceId: 01J3Y2QHB8FV4RGY7Y1QXNT2D4
                    errors:
                    - field: cursor
                      code: INVALID_CURSOR
                      message: O cursor informado é inválido ou expirou.
        '429':
          description: O limite de requisições desta operação foi excedido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                rateLimitExceeded:
                  summary: Rate limit da operação excedido
                  value:
                    type: https://api.example.com/problems/rate-limit-exceeded
                    title: Limite de requisições excedido
                    status: 429
                    detail: O limite de requisições para listar colaboradores foi excedido. Aguarde antes de tentar novamente.
                    instance: /api/v1/collaborators
                    code: RATE_LIMIT_EXCEEDED
                    traceId: 01J3Y2QHB8FV4RGY7Y1QXNT2D4
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '500':
          description: Ocorreu uma falha interna durante esta operação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                internalServerError:
                  summary: Erro interno específico da operação
                  value:
                    type: https://api.example.com/problems/internal-server-error
                    title: Falha interna ao processar a operação
                    status: 500
                    detail: Ocorreu uma falha inesperada ao listar colaboradores.
                    instance: /api/v1/collaborators
                    code: INTERNAL_SERVER_ERROR
                    traceId: 01J3Y2QHB8FV4RGY7Y1QXNT2D4
        '503':
          description: Uma dependência necessária para esta operação está temporariamente indisponível.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                serviceUnavailable:
                  summary: Dependência necessária indisponível
                  value:
                    type: https://api.example.com/problems/service-unavailable
                    title: Serviço temporariamente indisponível
                    status: 503
                    detail: Não foi possível listar colaboradores porque o MongoDB ou outra dependência necessária está indisponível.
                    instance: /api/v1/collaborators
                    code: SERVICE_UNAVAILABLE
                    traceId: 01J3Y2QHB8FV4RGY7Y1QXNT2D4
  /api/v1/collaborators/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Identificador do colaborador.
      schema:
        $ref: '#/components/schemas/ObjectId'
      example: 66a64ab05bd7213b90d9b001
    get:
      tags:
      - Collaborators
      summary: Consultar colaborador
      operationId: getCollaborator
      description: Retorna representação ativa ou histórica. Colaborador excluído não oferece links de alteração, exclusão
        ou criação de vínculo.
      parameters:
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Colaborador encontrado.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Collaborator'
              example:
                id: 66a64ab05bd7213b90d9b001
                name: Ana Souza
                cpf: '12345678909'
                email: ana.souza@example.com
                createdAt: '2026-07-27T12:00:00.000Z'
                updatedAt: '2026-07-27T12:00:00.000Z'
                deletedAt: null
                _links:
                  self:
                    href: /api/v1/collaborators/66a64ab05bd7213b90d9b001
                  collection:
                    href: /api/v1/collaborators
                  update:
                    href: /api/v1/collaborators/66a64ab05bd7213b90d9b001
                    method: PATCH
                  delete:
                    href: /api/v1/collaborators/66a64ab05bd7213b90d9b001
                    method: DELETE
                  documents:
                    href: /api/v1/collaborator-documents?collaboratorId=66a64ab05bd7213b90d9b001
                  link-document:
                    href: /api/v1/collaborator-documents
                    method: POST
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          description: A requisição desta operação possui sintaxe, identificador ou parâmetro inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalidObjectId:
                  summary: ObjectId inválido
                  value:
                    type: https://api.example.com/problems/invalid-object-id
                    title: Identificador inválido
                    status: 400
                    detail: O identificador informado para colaborador não possui o formato ObjectId esperado.
                    instance: /api/v1/collaborators/66a64ab05bd7213b90d9b003
                    code: INVALID_OBJECT_ID
                    traceId: 01J3Y2QHB8FV4RGY7Y1QXNT2D4
                    errors:
                    - field: id
                      code: INVALID_OBJECT_ID
                      message: Informe um ObjectId hexadecimal com 24 caracteres.
        '404':
          description: Um recurso necessário para esta operação não foi encontrado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                collaboratorNotFound:
                  summary: Colaborador inexistente
                  value:
                    type: https://api.example.com/problems/collaborator-not-found
                    title: Colaborador não encontrado
                    status: 404
                    detail: Nenhum colaborador foi encontrado com o identificador 66a64ab05bd7213b90d9b001.
                    instance: /api/v1/collaborators/66a64ab05bd7213b90d9b003
                    code: COLLABORATOR_NOT_FOUND
                    traceId: 01J3Y2QHB8FV4RGY7Y1QXNT2D4
        '429':
          description: O limite de requisições desta operação foi excedido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                rateLimitExceeded:
                  summary: Rate limit da operação excedido
                  value:
                    type: https://api.example.com/problems/rate-limit-exceeded
                    title: Limite de requisições excedido
                    status: 429
                    detail: O limite de requisições para consultar o colaborador foi excedido. Aguarde antes de tentar novamente.
                    instance: /api/v1/collaborators/66a64ab05bd7213b90d9b003
                    code: RATE_LIMIT_EXCEEDED
                    traceId: 01J3Y2QHB8FV4RGY7Y1QXNT2D4
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '500':
          description: Ocorreu uma falha interna durante esta operação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                internalServerError:
                  summary: Erro interno específico da operação
                  value:
                    type: https://api.example.com/problems/internal-server-error
                    title: Falha interna ao processar a operação
                    status: 500
                    detail: Ocorreu uma falha inesperada ao consultar o colaborador.
                    instance: /api/v1/collaborators/66a64ab05bd7213b90d9b003
                    code: INTERNAL_SERVER_ERROR
                    traceId: 01J3Y2QHB8FV4RGY7Y1QXNT2D4
        '503':
          description: Uma dependência necessária para esta operação está temporariamente indisponível.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                serviceUnavailable:
                  summary: Dependência necessária indisponível
                  value:
                    type: https://api.example.com/problems/service-unavailable
                    title: Serviço temporariamente indisponível
