  /api/v1/pending-documents:
    get:
      tags:
      - Queries
      summary: Consultar documentos pendentes
      operationId: listPendingDocuments
      description: Consulta vínculos com status=PENDING, deletedAt=null e unlinkedAt=null. Todos os filtros informados são
        combinados por AND. Nomes usam substring sem diferenciar caixa ou acentos; CPF e código usam correspondência exata,
        com código normalizado em maiúsculas. Filtros de colaborador e tipo usam lookup. Ordenação total por documentTypeId
        ASC, collaboratorId ASC e _id ASC.
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/IfNoneMatch'
      - name: collaboratorName
        in: query
        schema:
          type: string
      - name: cpf
        in: query
        schema:
          type: string
          pattern: ^\d{11}$
      - name: documentTypeName
        in: query
        schema:
          type: string
      - name: documentTypeCode
        in: query
        schema:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
      responses:
        '200':
          description: Página de documentos pendentes.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/PendingDocumentCollection'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          description: A requisição desta operação possui sintaxe, identificador ou parâmetro inválido.
