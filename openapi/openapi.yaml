      schema:
        $ref: '#/components/schemas/ObjectId'
      example: 66a64ab05bd7213b90d9b001
    post:
      tags:
      - Document Versions
      summary: Enviar ou reenviar uma versão
      operationId: createDocumentVersion
      description: Operação deliberadamente não idempotente. Cada chamada aceita cria uma nova versão, inclusive quando os
        metadados são idênticos. Não existe Idempotency-Key nem deduplicação por conteúdo. O número da versão é calculado
        atomicamente pelo MongoDB em um único findOneAndUpdate com pipeline. Reenvios simultâneos são preservados; retry após
        resposta incerta pode criar outra versão.
